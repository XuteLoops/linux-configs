# versions.conf
#
# Central place for pinned versions / recommended values referenced by
# modules. Sourced as a shell file, so keep this to plain VAR=value lines.
# Update here rather than hunting through module code.

# Single shared Bottles bottle used for all Windows-only music production
# software (Ableton, FL Studio, and their VST plugins via yabridge). Using
# one bottle rather than one-per-app is what makes a single yabridge/VST3
# config actually work across both DAWs.
MUSIC_BOTTLE_NAME="Music Production"
# Confirmed via 'bottles-cli --json list components -f category:runners' —
# use whatever that command actually reports on your system. If you later
# install a different runner (e.g. a kron4ek build) via Bottles' own
# runner manager or ProtonUp-Qt, update this to match and re-run the
# music module to rebuild the bottle against it.
MUSIC_BOTTLE_RUNNER="sys-wine-11.0"

# Recommended Bottles Wine runner for FL Studio (per fl-studio-linux-setup
# guide, as of Jan 2026). Revisit periodically — this moves. Currently the
# same as MUSIC_BOTTLE_RUNNER, kept separate in case FL/Ableton ever need
# to diverge.
FL_STUDIO_RUNNER="$MUSIC_BOTTLE_RUNNER"
ABLETON_RUNNER="$MUSIC_BOTTLE_RUNNER"

# yabridge-bottles-wineloader repo (bridges yabridge to a Bottles prefix
# instead of the default system Wine prefix).
YABRIDGE_BOTTLES_LOADER_REPO="https://github.com/microfortnight/yabridge-bottles-wineloader"

# tascam-gtk AUR package name (personal/tascam.sh)
TASCAM_GTK_AUR_PKG="tascam-gtk-git"

# icaclient AUR package name (personal/citrix.sh)
ICACLIENT_AUR_PKG="icaclient"