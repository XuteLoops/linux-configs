# versions.conf
#
# Central place for pinned versions / recommended values referenced by
# modules. Sourced as a shell file, so keep this to plain VAR=value lines.
# Update here rather than hunting through module code.

# Recommended Bottles Wine runner for FL Studio (per fl-studio-linux-setup
# guide, as of Jan 2026). Revisit periodically — this moves.
FL_STUDIO_RUNNER="kron4ek-wine-11.0-amd64"

# Recommended Bottles Wine runner for Ableton (WineASIO needs to be
# registered against whatever runner is actually selected in the bottle;
# this is just a sane starting point).
ABLETON_RUNNER="ge-proton-latest"

# yabridge-bottles-wineloader repo (bridges yabridge to a Bottles prefix
# instead of the default system Wine prefix).
YABRIDGE_BOTTLES_LOADER_REPO="https://github.com/microfortnight/yabridge-bottles-wineloader"

# tascam-gtk AUR package name (personal/tascam.sh)
TASCAM_GTK_AUR_PKG="tascam-gtk-git"

# icaclient AUR package name (personal/citrix.sh)
ICACLIENT_AUR_PKG="icaclient"
